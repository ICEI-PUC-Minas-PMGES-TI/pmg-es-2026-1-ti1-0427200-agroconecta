<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AgroConecta</title>

  <link rel="stylesheet" href="tecnicosdisponiveis.css">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">

    <div class="container">

      <a class="navbar-brand fw-bold fs-3" href="#">
        <i class="bi bi-tree-fill"></i>
        AgroConecta
      </a>

    </div>

  </nav>

  <!-- CONTEÚDO -->

  <main class="container my-5">

    <!-- BUSCA -->

    <div class="mb-5">

      <input
        type="text"
        id="campo-busca"
        class="form-control form-control-lg"
        placeholder="Pesquisar técnico..."
      >

    </div>

    <!-- LISTA -->

    <section class="mb-5">

      <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold text-success m-0">
          Técnicos Disponíveis
        </h2>

        <button
          class="btn btn-success"
          onclick="window.location.href='../cadastroservicos/cadastroservicos.html'">

          <i class="bi bi-plus-circle"></i>
          Cadastrar Serviço

        </button>

      </div>

      <div
        class="row g-4"
        id="lista-tecnicos">
      </div>

    </section>

    <!-- PERFIL -->

    <section
      class="perfil-container p-4 shadow rounded"
      id="perfil-tecnico">
    </section>

    <!-- FORMULÁRIO -->

    <section class="mt-5">

      <div class="card p-4 shadow border-0">

        <h3
          class="fw-bold mb-4"
          id="titulo-avaliacao">

          Avaliar Técnico

        </h3>

        <!-- ESTRELAS -->

        <div class="mb-4">

          <label class="form-label fw-semibold">
            Sua nota
          </label>

          <div
            class="fs-2 estrelas"
            id="estrelas"
          >

            <span data-nota="1">⭐</span>
            <span data-nota="2">⭐</span>
            <span data-nota="3">⭐</span>
            <span data-nota="4">⭐</span>
            <span data-nota="5">⭐</span>

          </div>

        </div>

        <!-- COMENTÁRIO -->

        <div class="mb-4">

          <label class="form-label fw-semibold">
            Comentário
          </label>

          <textarea
            id="comentario"
            class="form-control"
            rows="5"
            placeholder="Digite sua avaliação..."
          ></textarea>

        </div>

        <!-- BOTÃO -->

        <button
          class="btn btn-success btn-lg"
          id="btn-avaliar"
        >

          Enviar Avaliação

        </button>

      </div>

    </section>

  </main>

  <script src="tecnicosdisponiveis.js"></script>

</body>

</html>
