<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgroConecta</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/login.css">
</head>
<body>
    <section class="login-section">
        <div class="container">
            <div class="login-box">
                <div class="login-logo">
                    <svg viewBox="0 0 32 32" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                        <rect width="32" height="32" rx="6" fill="#25a456"/>
                        <path d="M8 16c0-2.2 1.8-4 4-4s4 1.8 4 4-1.8 4-4 4-4-1.8-4-4zm10 4h2l4-8h-2l-4 8z" fill="white"/>
                    </svg>
                    <span class="logo-text">Agro<strong>Conecta</strong></span>
                </div>

                <h1>Bem-vindo de volta</h1>
                <p class="subtitle">Entre na sua conta para continuar.</p>

                <div class="tabs">
                    <button class="tab-btn active" onclick="trocarAbaLogin('profissional', this)">Sou Profissional</button>
                    <button class="tab-btn" onclick="trocarAbaLogin('cliente', this)">Sou Cliente</button>
                </div>

                <div id="msg-erro" class="msg-erro">E-mail ou senha incorretos.</div>

                <div id="tab-login-profissional" class="tab-panel active">
                    <form id="form-login-profissional" onsubmit="fazerLoginProfissional(event)">
                        <div class="form-group">
                            <label>E-mail</label>
                            <input type="email" id="p-email" required placeholder="seu@email.com">
                        </div>
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="p-senha" required placeholder="••••••">
                        </div>
                        <button type="submit" class="btn-login">Entrar como Profissional</button>
                    </form>
                </div>

                <div id="tab-login-cliente" class="tab-panel">
                    <form id="form-login-cliente" onsubmit="fazerLoginCliente(event)">
                        <div class="form-group">
                            <label>E-mail</label>
                            <input type="email" id="c-email" required placeholder="seu@email.com">
                        </div>
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="c-senha" required placeholder="••••••">
                        </div>
                        <button type="submit" class="btn-login">Entrar como Cliente</button>
                    </form>
                </div>

                <p class="divider">Não tem conta? <a href="../../cadastro.html">Cadastre-se grátis</a></p>
                <p class="divider" style="margin-top:8px"><a href="../../index.html">← Voltar ao início</a></p>
            </div>
        </div>
    </section>

    <script src="../../assets/js/login.js"></script>
</body>
</html>
