<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroConecta - Fórum</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/forum.css">
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg px-4">

            <article class="container-fluid">

                <a class="navbar-brand" href="#">
                    AgroConecta
                </a>

                <form class="d-flex mx-auto w-50">
                    <input
                        class="form-control"
                        type="search"
                        placeholder="Pesquisar tópicos...">
                </form>

                <article class="d-flex gap-3">

                    <button class="icon-btn">
                        <i class="bi bi-gear-fill"></i>
                    </button>

                    <button class="icon-btn">
                        <i class="bi bi-question-circle-fill"></i>
                    </button>

                </article>

            </article>

        </nav>

    </header>

    <main class="container-fluid main-container">

        <div class="row h-100">

            <section
                id="topics-list"
                class="col-md-4 col-lg-3 p-0 topics-panel">

                <div class="d-flex justify-content-center m-4">

                    <button
                        class="btn btn-success"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#novoTopicoForm">

                        <i class="bi bi-plus-circle me-2"></i>
                        Nova Discussão

                    </button>

                </div>

                <div
                    class="collapse mb-4"
                    id="novoTopicoForm">

                    <div class="card card-body">

                        <h5 class="mb-3">
                            Criar Nova Discussão
                        </h5>

                        <div class="mb-3">

                            <label
                                for="tituloTopico"
                                class="form-label">

                                Título da Discussão

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="tituloTopico"
                                placeholder="Ex: Cultivo de soja em período seco">

                        </div>

                        <div class="mb-3">

                            <label
                                for="descricaoTopico"
                                class="form-label">

                                Descrição Breve

                            </label>

                            <textarea
                                id="descricaoTopico"
                                class="form-control"
                                rows="3"
                                placeholder="Descreva brevemente o assunto da discussão..."></textarea>

                        </div>

                        <div class="mb-3">

                            <label
                                for="categoriaTopico"
                                class="form-label">

                                Categoria

                            </label>

                            <select
                                id="categoriaTopico"
                                class="form-select">

                                <option selected disabled>
                                    Selecione uma categoria
                                </option>

                                <option value="Agricultura">Agricultura</option>
                                <option value="Cafeicultura">Cafeicultura</option>
                                <option value="Tecnologia">Tecnologia</option>
                                <option value="Produção">Produção</option>
                                <option value="Pecuária">Pecuária</option>
                                <option value="Sustentabilidade">Sustentabilidade</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label
                                for="conteudoTopico"
                                class="form-label">

                                Conteúdo da Discussão

                            </label>

                            <textarea
                                id="conteudoTopico"
                                class="form-control"
                                rows="5"
                                placeholder="Digite o conteúdo inicial da discussão..."></textarea>

                        </div>

                        <div class="text-end">

                            <button
                                class="btn btn-outline-secondary me-2"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#novoTopicoForm">

                                Cancelar

                            </button>

                            <button
                                id="btnCriarTopico"
                                class="btn btn-success">

                                Publicar Discussão

                            </button>

                        </div>

                    </div>

                </div>

                <div class="topics-header p-3 border-bottom">

                    <h4 class="mb-0">
                        Discussões em Alta
                    </h4>

                </div>

            </section>

            <section
                class="col-md-8 col-lg-9 p-0 discussion-panel">

                <div class="discussion-content p-4">

                    <h2
                        id="discussion-title"
                        class="mb-3">
                    </h2>

                    <div
                        id="discussion-author"
                        class="d-flex gap-3 mb-4 text-muted">
                    </div>

                    <p id="discussion-content"></p>

                    <hr class="my-4">

                    <h5 class="mb-4">
                        Comentários
                    </h5>

                    <div id="comments-container"></div>

                    <section class="comment-box p-3">

                        <h6 class="mb-3">
                            Adicionar comentário
                        </h6>

                        <div class="mb-3">

                            <textarea
                                id="comment-input"
                                class="form-control"
                                rows="4"
                                placeholder="Digite seu comentário..."></textarea>

                        </div>

                        <div class="d-flex justify-content-end">

                            <button
                                id="publish-btn"
                                class="btn btn-success px-4">

                                Publicar

                            </button>

                        </div>

                    </section>

                </div>

            </section>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/forum.js"></script>

</body>

</html>
