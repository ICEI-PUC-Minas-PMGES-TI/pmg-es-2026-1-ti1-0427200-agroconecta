<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgroConecta - Histórico de Serviços</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="historicoservicos.css">
</head>

<body>

<nav class="navbar navbar-dark bg-success">
  <div class="container">
    <span class="navbar-brand fw-bold">
      🌱 AgroConecta - Histórico de Vendas e Serviços
    </span>
  </div>
</nav>

<div class="container my-4">

  <div class="card p-4 mb-4">

    <h3 class="mb-3">Cadastrar Serviço</h3>

    <form id="form-servico">

      <div class="row">

        <div class="col-md-4 mb-3">
          <input
            type="text"
            id="servico"
            class="form-control"
            placeholder="Serviço"
            required>
        </div>

        <div class="col-md-4 mb-3">
          <input
            type="text"
            id="cliente"
            class="form-control"
            placeholder="Cliente"
            required>
        </div>

        <div class="col-md-4 mb-3">
          <input
            type="text"
            id="tecnico"
            class="form-control"
            placeholder="Técnico"
            required>
        </div>

        <div class="col-md-4 mb-3">
          <input
            type="date"
            id="data"
            class="form-control"
            required>
        </div>

        <div class="col-md-4 mb-3">
          <input
            type="number"
            id="valor"
            class="form-control"
            placeholder="Valor"
            required>
        </div>

        <div class="col-md-4 mb-3">
          <select
            id="status"
            class="form-select">

            <option>Concluído</option>
            <option>Em andamento</option>
            <option>Cancelado</option>

          </select>
        </div>

      </div>

      <button class="btn btn-success">
        Salvar Serviço
      </button>

    </form>

  </div>

  <div class="card p-4">

    <div class="d-flex justify-content-between mb-3">

      <h3>Histórico</h3>

      <input
        type="text"
        id="pesquisa"
        class="form-control w-25"
        placeholder="Pesquisar">

    </div>

    <table class="table table-striped">

      <thead>

        <tr>
          <th>Serviço</th>
          <th>Cliente</th>
          <th>Técnico</th>
          <th>Data</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>

      </thead>

      <tbody id="tabela-servicos"></tbody>

    </table>

    <h5 class="mt-3">
      Total movimentado:
      <span id="total"></span>
    </h5>

  </div>

</div>

<script src="historicoservicos.js"></script>

</body>
</html>z
