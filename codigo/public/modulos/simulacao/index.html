<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulação de Parcelamento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Simulação de Parcelamento</h1>

    <section>
      <label>Valor total</label>
      <input type="number" id="valorTotal" placeholder="Ex: 1000">

      <label>Entrada</label>
      <input type="number" id="entrada" placeholder="Ex: 200">

      <label>Número de parcelas</label>
      <input type="number" id="parcelas" placeholder="Ex: 5">

      <label>Taxa de juros (%)</label>
      <input type="number" id="juros" placeholder="Ex: 10">

      <button onclick="calcular()">Calcular</button>
    </section>

    <section id="resultado" style="display:none"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
