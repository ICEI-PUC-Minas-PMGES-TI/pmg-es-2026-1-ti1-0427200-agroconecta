<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <h1>Sistema de Avaliações</h1>

  <section>
    <h2>Escolha um profissional</h2>
    <button onclick="trocarProfissional(1)">João Pedro</button>
    <button onclick="trocarProfissional(2)">Mariana Alves</button>
    <button onclick="trocarProfissional(3)">Carlos Silva</button>
  </section>

  <section id="informacoesProfissional"></section>

  <section>
    <h2>Avaliações</h2>
    <div id="listaAvaliacoes"></div>
  </section>

  <section>
    <h2>Nova avaliação</h2>
    <label>Nome</label>
    <input type="text" id="usuario" placeholder="Digite seu nome">
    <label>Nota</label>
    <input type="number" id="nota" min="0" max="10" placeholder="Digite uma nota">
    <label>Comentário</label>
    <textarea id="comentario" placeholder="Digite seu comentário"></textarea>
    <button onclick="adicionarAvaliacao()">Enviar avaliação</button>
  </section>

</main>
<script src="script.js"></script>
</body>
</html>
