<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliações</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main>

  <h1>Sistema de Avaliações</h1>

  <section>
    <h2>Escolha um profissional</h2>
    <button>João Pedro</button>
    <button>Mariana Alves</button>
    <button>Carlos Silva</button>
  </section>

  <section id="informacoesProfissional">
  </section>

  <section>
    <h2>Avaliações</h2>
    <div id="listaAvaliacoes">
    </div>
  </section>

  <section>
    <h2>Nova avaliação</h2>

    <label>Nome</label>
    <input type="text" id="usuario" placeholder="Digite seu nome">

    <label>Nota</label>
    <input type="number" id="nota" min="0" max="10" placeholder="Digite uma nota">

    <label>Comentário</label>
    <textarea id="comentario" placeholder="Digite seu comentário"></textarea>

    <button >Enviar avaliação</button>
  </section>

</main>

</body>
</html>
